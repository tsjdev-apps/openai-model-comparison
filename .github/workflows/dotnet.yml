name: Build .NET

permissions:
  contents: read

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    
    - uses: actions/checkout@v7
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
        
    - name: Restore dependencies
      run: dotnet restore OpenAIModelComparison.slnx
      
    - name: Build
      run: dotnet build OpenAIModelComparison.slnx --no-restore

    - name: Test
      run: dotnet test OpenAIModelComparison.slnx --no-build --no-restore
